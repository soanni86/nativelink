{{- if .Values.local_storage_cas.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nativelink-cas
  labels:
    {{- include "nativelink-applovin.labels" . | nindent 4 }}
    component: local_storage_cas
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: nativelink-local-cas
  minReplicas: {{ .Values.local_storage_cas.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.local_storage_cas.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.local_storage_cas.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.local_storage_cas.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.local_storage_cas.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.local_storage_cas.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}
---
{{- if .Values.scheduler.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nativelink-scheduler
  labels:
    {{- include "nativelink-applovin.labels" . | nindent 4 }}
    component: local_storage_cas
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nativelink-scheduler
  minReplicas: {{ .Values.scheduler.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.scheduler.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.scheduler.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.scheduler.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.scheduler.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.scheduler.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}
---
{{- if .Values.worker.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nativelink-scheduler
  labels:
    {{- include "nativelink-applovin.labels" . | nindent 4 }}
    component: local_storage_cas
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: nativelink-worker
  minReplicas: {{ .Values.worker.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.worker.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.worker.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.worker.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.worker.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.worker.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}
