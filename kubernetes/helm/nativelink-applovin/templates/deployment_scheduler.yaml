apiVersion: apps/v1
kind: Deployment
metadata:
  name: nativelink-scheduler
  labels:
    {{- include "nativelink-applovin.labels" . | nindent 4 }}
    component: scheduler
spec:
  {{- if not .Values.scheduler.autoscaling.enabled }}
  replicas: {{ .Values.scheduler.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "nativelink-applovin.selectorLabels" . | nindent 6 }}
      component: scheduler
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap_scheduler.yaml") . | sha256sum }}
      {{- with .Values.scheduler.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "nativelink-applovin.selectorLabels" . | nindent 8 }}
        component: scheduler
    spec:
      {{- with .Values.scheduler.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "nativelink-applovin.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.scheduler.podSecurityContext | nindent 8 }}
      containers:
        - name: nativelink
          securityContext:
            {{- toYaml .Values.scheduler.securityContext | nindent 12 }}
          image: "{{ .Values.scheduler.image.repository }}:{{ .Values.scheduler.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.scheduler.image.pullPolicy }}
          {{- with .Values.scheduler.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            - "/conf.json5"
        {{- with .Values.scheduler.containerPorts }}
          ports:
            {{- toYaml . | nindent 12 }}
        {{- end }}
        {{- with .Values.scheduler.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
        {{- end }}
        {{- with .Values.scheduler.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
        {{- end }}
        {{- with .Values.scheduler.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
        {{- end }}
          resources:
            {{- toYaml .Values.scheduler.resources | nindent 12 }}
          volumeMounts:
            - name: nativelink-config
              mountPath: /conf.json5
              subPath: conf.json5
      {{- with .Values.scheduler.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.scheduler.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.scheduler.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: nativelink-config
          configMap:
            name: nativelink-config-scheduler
